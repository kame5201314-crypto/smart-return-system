name: Quality Gates

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test-and-predeploy-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Predeploy checks
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEMA_DRIFT_ALERT_WEBHOOK_URL: ${{ secrets.SCHEMA_DRIFT_ALERT_WEBHOOK_URL }}
          SCHEMA_DRIFT_ALERT_TOKEN: ${{ secrets.SCHEMA_DRIFT_ALERT_TOKEN }}
        run: |
          npm run prebuild:schema-gate
          npm run prebuild:alerts
          npm run prebuild:encoding

      - name: Full test suite
        run: npm run test:all
